# Owner: A. Others request dependency changes via docs/handoffs (see docs/OWNERSHIP.md).
# Exact versions are pinned in uv.lock; always install with `uv sync --locked`.
[project]
name = "recall-radar"
version = "0.1.0"
description = "Replays public NHTSA owner complaints and checks whether unusual growth preceded documented investigations."
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "pyyaml>=6",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not real_data'"
markers = [
  "real_data: needs the local NHTSA snapshot under data/ (run with: uv run pytest -m real_data)",
  "slow: takes more than ~30 s",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "data", "exports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
